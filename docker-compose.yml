services:
  # ── Streamlit UI ──────────────────────────
  app:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    container_name: scraper-app
    restart: unless-stopped
    ports:
      - "${PORT:-8501}:8501"
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Background Worker (batch jobs) ────────
  worker:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    container_name: scraper-worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - app-data:/app/data
    command: ["python", "-m", "scraper.scripts.worker"]

volumes:
  app-data: