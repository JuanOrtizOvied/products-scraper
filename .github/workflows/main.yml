name: Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  bump:
    name: Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.new_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bump version and push tag
        id: version
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: minor
          RELEASE_BRANCHES: main
          WITH_V: true
          PRERELEASE: true
          PRERELEASE_SUFFIX: prod
          INITIAL_VERSION: 1.0.0
          MINOR_STRING_TOKEN: feat
          PATCH_STRING_TOKEN: fix

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          gh release create "$TAG" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${TAG}" \
              --generate-notes

  # ── 4. Build & Push to ECR ──────────────────
  build:
    name: Build
    needs:
      - bump
    uses: ./.github/workflows/build_image.yml
    with:
      tag: ${{ needs.bump.outputs.version }}
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws_region: ${{ secrets.AWS_REGION }}
      ecr_repository_name: ${{ vars.ECR_REPOSITORY_NAME }}

  # ── 5. Deploy (blue-green on self-hosted) ───
  deploy:
    name: Deploy
    needs:
      - build
      - bump
    runs-on: production-server
    environment: Production
    env:
      ECR_IMAGE: ${{ secrets.AWS_ECR_REGISTRY }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY_NAME }}:${{ needs.bump.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production Environment
        uses: ./.github/actions/deploy
        with:
          stage: production
          domain: scraper.${{ secrets.HOSTED_ZONE }}
          ecr_image: ${{ env.ECR_IMAGE }}
          aws_region: ${{ secrets.AWS_REGION }}
          aws_secret_name: ${{ secrets.PRODUCTION_SECRET_NAME }}